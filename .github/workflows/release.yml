name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const p = require("./package.json"); const tag = process.env.RELEASE_TAG.replace(/^v/, ""); if (p.version !== tag) { throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version ${p.version}`); }'

      - name: Pack release artifact
        run: |
          mkdir release-artifacts
          npm pack --json --pack-destination release-artifacts > release-artifacts/pack.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz --title "$GITHUB_REF_NAME" --generate-notes
