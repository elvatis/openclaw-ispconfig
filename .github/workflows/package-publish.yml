name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the ClawHub publication without uploading a release"
        required: true
        default: true
        type: boolean
      changelog:
        description: "Release notes shown on ClawHub"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

      - name: Create package artifact
        run: |
          mkdir clawpack
          npm pack --json --pack-destination clawpack > clawpack/pack.json

      - uses: actions/upload-artifact@v4
        with:
          name: clawpack
          path: clawpack/*.tgz
          if-no-files-found: error

  publish:
    needs: build-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Validate package for OpenClaw 2026.8.1
        run: npm exec --yes --package=clawhub@0.23.3 -- clawhub package validate . --openclaw-version 2026.8.1

      - name: Publish package through ClawHub OIDC
        env:
          CLAWHUB_CHANGELOG: ${{ inputs.changelog }}
          CLAWHUB_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$CLAWHUB_DRY_RUN" = "true" ]; then
            dry_run_flag=(--dry-run)
          else
            dry_run_flag=()
          fi
          npm exec --yes --package=clawhub@0.23.3 -- clawhub package publish . \
            --family code-plugin \
            "${dry_run_flag[@]}" \
            --wait \
            --wait-timeout 1800 \
            --json \
            --changelog "$CLAWHUB_CHANGELOG" \
            --source-repo elvatis/openclaw-ispconfig \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_SHA"
